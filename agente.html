<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolução do agente — Sentinela</title>
<script src="assets/tema.js"></script>
<link rel="stylesheet" href="assets/fontes.css">
<link rel="stylesheet" href="assets/carta.css">
<style>
  :root{--bg:#EEF2F8;--card:#FFFFFF;--tx:#12233B;--mut:#4A5D7C;--bd:#D5DEEA;--pri:#F7B500;--pri-tx:#0A1B33;--warn:#8A6100;--warn-bg:#FFF4D6;--bad:#B3261E;--bad-bg:#FDECEA;--ok:#0B7A44;--ok-bg:#E4F6EC;--info-bg:#E6F1FB;--info:#1565B8;--soft:#F2F6FB;--serie:#0F5FB0;color-scheme:light}
  :root[data-theme="dark"]{--bg:#071426;--card:#0C1F3A;--tx:#E6EDF7;--mut:#9DB2D0;--bd:#1D3C68;--pri:#F7B500;--pri-tx:#0A1B33;--warn:#FFC93D;--warn-bg:#3A2D12;--bad:#FF8478;--bad-bg:#3A1D22;--ok:#5CE59A;--ok-bg:#12301F;--info-bg:#10304F;--info:#6CC4F2;--soft:#102848;--serie:#F7B500;color-scheme:dark}
  header.topo{border-bottom-color:#1D3C68}
  header.topo a{color:#9DD3F5}
  .tema-btn{background:transparent;border:1px solid #2C4F82;color:#DCE7F5;border-radius:6px;padding:6px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap;margin-left:auto}
  .tema-btn + a{margin-left:0}
  .tema-btn:hover{border-color:#F7B500}
  .ico{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico-sol{display:none}:root[data-theme="dark"] .ico-sol{display:inline}:root[data-theme="dark"] .ico-lua{display:none}
  @media (max-width:480px){.tema-btn .tema-txt{display:none}.tema-btn{padding:6px 8px}header.topo{padding-left:10px;padding-right:10px}header.topo .marca{gap:6px}header.topo img{height:22px;padding:2px 4px}header.topo b{font-size:.9rem;letter-spacing:.02em}header.topo a{font-size:.72rem}header.topo b i{display:none}}
  header.topo{background:#050F20;border-bottom:1px solid var(--bd);position:relative;margin:0 0 14px;padding:12px 16px 15px}
  header.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#F7B500 0 120px,#FF5143 120px 168px,#19B8A3 168px 196px,transparent 196px)}
  header.topo .marca{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
  header.topo img{height:34px;background:#fff;padding:3px 8px;border-radius:4px}
  header.topo b{white-space:nowrap;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.2rem;letter-spacing:.04em;color:#fff}
  header.topo b i{font-style:normal;color:#2BA8E8;font-weight:600}
  header.topo a{margin-left:auto;font-size:.85rem;white-space:nowrap}
  @media (max-width:480px){header.topo .marca{gap:8px}header.topo img{height:26px;padding:2px 6px}header.topo b{font-size:1.02rem}header.topo a{font-size:.78rem}}
  h1,h2{font-family:"Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.01em}
  :focus-visible{outline:2px solid #F7B500;outline-offset:2px}
  *{box-sizing:border-box} html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:860px;margin:0 auto;padding:16px}
  h1{font-size:1.35rem;margin:6px 0 2px} h2{font-size:1.05rem;margin:0 0 8px}
  .mut{color:var(--mut);font-size:.9rem} a{color:var(--info)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{border:1px solid var(--bd);border-radius:10px;padding:10px} .kpi span{display:block;font-size:.72rem;text-transform:uppercase;color:var(--mut);font-weight:700}
  .kpi strong{font-size:1.25rem}
  .grafico{position:relative;height:260px}
  table{width:100%;border-collapse:collapse;font-size:.9rem} td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left} td.n,th.n{text-align:right}
  .neg{color:var(--bad);font-weight:600} .pos{color:var(--ok);font-weight:600}
  .aviso{background:var(--warn-bg);color:var(--warn);padding:10px;border-radius:6px}
  input{width:100%;min-height:46px;padding:10px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
  #lista a{display:block;padding:10px 4px;border-bottom:1px solid var(--bd);text-decoration:none}
  .carta-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin:12px 0}
  .carta-info{flex:1;min-width:230px}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
  .bt-img{min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .bt-img:hover,.bt-img:focus-visible{border-color:var(--pri)}
  .bt-img.zap{background:#0B6B3A;border-color:#0B6B3A;color:#fff}
  .bt-img[disabled]{opacity:.6;cursor:progress}
  .carta-info h2{margin-top:0}
  .carta-info table td{padding:3px 8px 3px 0;vertical-align:top;font-size:.88rem}
  .carta-info td:first-child{font-weight:700;white-space:nowrap}
  .tl{list-style:none;margin:8px 0 0;padding:0 0 0 18px;border-left:3px solid var(--bd)}
  .tl > li{position:relative;padding:0 0 16px 14px}
  .tl > li::before{content:"";position:absolute;left:-26px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--serie)}
  .tl .quando{font-weight:700}
  .tl .lin{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .qd{display:inline-flex;flex-wrap:wrap;gap:3px;max-width:100%}
  .qd i{width:11px;height:14px;border-radius:3px;border:2px solid var(--mut);display:inline-block}
  .qd i.on{background:var(--serie);border-color:var(--serie)}
  .chip{display:inline-flex;gap:5px;align-items:center;font-size:.78rem;font-weight:600;border:1px solid var(--bd);background:var(--soft);padding:2px 8px;border-radius:999px}
  .chip.par{border-style:dashed}
  .tl ul{list-style:none;margin:8px 0 0;padding:0 0 0 4px}
  .tl ul li{padding:5px 0;border-top:1px dashed var(--bd);font-size:.9rem}
  .tl-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin:6px 0 2px}
  body.modo-apresentacao .nome{filter:blur(7px)}
  label.tg{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--mut)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol><symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol><symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol><symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4"/></symbol><symbol id="i-cone" viewBox="0 0 24 24"><path d="M3 20h18M7 20l3-14h4l3 14M8.5 14h7"/></symbol><symbol id="i-timeline" viewBox="0 0 24 24"><path d="M12 3v18"/><circle cx="12" cy="7" r="2"/><circle cx="12" cy="17" r="2"/><path d="M14 7h6M4 17h6"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.500"/><circle cx="18" cy="6" r="2.500"/><circle cx="18" cy="18" r="2.500"/><path d="M8.200 10.800l7.600-3.600M8.200 13.200l7.600 3.600"/></symbol></svg>
<header class="topo"><div class="marca"><img src="assets/logo_ponta_pora.png" alt="Prefeitura Municipal de Ponta Porã"><b>SENTINELA <i>evolução</i></b><button type="button" class="tema-btn" data-tema-btn title="Mudar para o tema escuro"><svg class="ico ico-lua" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ico ico-sol" aria-hidden="true"><use href="#i-sun"/></svg> <span class="tema-txt">Tema escuro</span></button><a href="index.html">← Dashboard</a></div></header>
<main>
  <label class="tg"><input type="checkbox" id="apres" style="width:auto;min-height:0"> Modo apresentação (ocultar nomes)</label>
  <div id="conteudo"><p class="mut">Carregando…</p></div>
</main>
<script src="assets/agentes_dados.js"></script>
<script src="assets/carta.js"></script>
<script src="assets/chart.umd.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = n => n == null ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
$('apres').onchange = e => document.body.classList.toggle('modo-apresentacao', e.target.checked);
try { if (window.opener && window.opener.document.body.classList.contains('modo-apresentacao')) { $('apres').checked = true; document.body.classList.add('modo-apresentacao'); } } catch (e) {}

function achar(D, q) {
  const id = q.get('id'), nome = q.get('nome');
  if (id && D.agentes[id]) return D.agentes[id];
  if (nome) return Object.values(D.agentes).find(a => norm(a.nome) === norm(nome)) || null;
  return null;
}
if (window.aplicarTemaGraficos) aplicarTemaGraficos(); Chart.defaults.font.family = "'IBM Plex Sans', system-ui, sans-serif";
const SV = (n, c) => `<svg class="ico${c ? ' ' + c : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
function carta(a, ms) {
  const c = Carta.html(a, ms); if (!c) return '';
  const m = Carta.medidas(ms);
  return `<div class="carta-wrap">${c}
    <div class="carta-info"><h2>Como ler o cartão</h2><table>${m.st.map(x => `<tr><td>${x[0]}</td><td>${Carta.NOMES[x[0]]}</td></tr>`).join('')}</table>
      <p class="mut">A nota grande é a nota do mês. As seis medidas vão de 0 a 99 e usam só dados do ranking:
      <b>ASS</b> dias trabalhados ÷ esperados · <b>TUR</b> turnos com lançamento · <b>CON</b> quanto menos a nota oscila entre os meses, maior ·
      <b>EVO</b> 50 = igual ao mês anterior, sobe 5 por ponto ganho · <b>POS</b> lugar no ranking · <b>MED</b> média dos meses.
      Nível: ouro ≥ 90, prata ≥ 75, bronze abaixo disso; <b>destaque</b> = top 3 com nota ≥ 90.</p>
      <div class="acoes"><button type="button" class="bt-img" id="bBaixar">${SV('download')} Baixar imagem</button><button type="button" class="bt-img zap" id="bZap">${SV('share')} Enviar pelo WhatsApp</button></div>
      <p class="mut" id="msgImg" role="status" aria-live="polite"></p>
      <p><a href="album.html">Ver o álbum com todas as cartinhas →</a></p></div></div>`;
}
function qd(trab, esp) {
  const t = Math.max(0, Math.round(trab || 0)), e = Math.max(Math.round(esp || 0), t);
  return `<span class="qd" role="img" aria-label="${t} de ${e} dias trabalhados">${'<i class="on"></i>'.repeat(t)}${'<i></i>'.repeat(e - t)}</span>`;
}
const chipsPar = ps => (ps || []).map(p => `<span class="chip par" title="Parada da equipe: não conta como falta">${SV('cone')} ${esc(p.motivo)} · ${p.dias} ${p.dias === 1 ? 'dia' : 'dias'}</span>`).join('');
const dd = v => f1(v).replace(',0', '');
function linhaTempo(ms, sem) {
  if (!ms.length) return '';
  const itens = ms.slice().reverse().map(m => {
    const ss = sem.filter(s => s.mes === m.mes).sort((x, y) => x.n - y.n);
    const sub = ss.length ? `<ul>${ss.map(s => `<li><div class="lin"><span class="quando">Semana ${s.n}</span><span class="mut">${esc(s.periodo)}${s.parcial ? ' · parcial' : ''}</span>${qd(s.trab, s.esp)}<span>${dd(s.trab)} de ${dd(s.esp)} dias · nota ${f1(s.pontos)}</span>${chipsPar(s.paradas)}</div></li>`).join('')}</ul>` : '';
    return `<li><div class="lin"><span class="quando">${esc(m.mes)}</span>${qd(m.trab, m.esp)}<span>${dd(m.trab)} de ${dd(m.esp)} dias · nota <b>${f1(m.pontos)}</b> · ${m.pos}º de ${m.total}</span>${m.fechado ? '<span class="chip">mês fechado</span>' : ''}${chipsPar(m.paradas)}</div>${sub}</li>`;
  }).join('');
  return `<div class="card"><h2>${SV('timeline')} Linha do tempo</h2>
    <div class="tl-leg"><span><span class="qd"><i class="on"></i></span> dia trabalhado</span><span><span class="qd"><i></i></span> dia esperado sem lançamento</span><span>${SV('cone')} parada da equipe (chuva, reunião, mutirão…) não conta como falta</span></div>
    <ol class="tl">${itens}</ol></div>`;
}
function desenhar() {
  const D = window.AGENTES_DADOS, alvo = $('conteudo');
  if (!D || !D.agentes || !Object.keys(D.agentes).length) { alvo.innerHTML = '<div class="card aviso">Ainda não há dados de agentes. Volte depois da próxima atualização do site.</div>'; return; }
  const q = new URLSearchParams(location.search), a = achar(D, q);
  if (!a) {
    const busca = (q.get('id') || q.get('nome')) ? '<div class="card aviso">Não encontrei esse agente. Procure pelo nome:</div>' : '<p class="mut">Escolha o agente:</p>';
    alvo.innerHTML = `<h1><svg class="ico" aria-hidden="true"><use href="#i-trend"/></svg> Evolução do agente</h1>${busca}<input id="b" placeholder="Digite parte do nome" autocomplete="off"><div id="lista"></div>`;
    const lista = () => { const t = norm($('b').value);
      $('lista').innerHTML = Object.entries(D.agentes).filter(([, x]) => !t || norm(x.nome).includes(t)).sort((x, y) => x[1].nome.localeCompare(y[1].nome, 'pt-BR')).slice(0, 60)
        .map(([k, x]) => `<a href="?${/^\d+$/.test(k) ? 'id=' + k : 'nome=' + encodeURIComponent(x.nome)}"><span class="nome">${esc(x.nome)}</span> <span class="mut">· ${esc(x.equipe)}</span></a>`).join(''); };
    $('b').oninput = lista; lista(); return;
  }
  const ms = a.meses, ult = ms[ms.length - 1], sem = a.semanas;
  document.title = 'Evolução — ' + a.nome;
  const media = ms.length ? ms.reduce((t, m) => t + (m.pontos || 0), 0) / ms.length : null;
  const trab = ult ? `${f1(ult.trab).replace(',0', '')} de ${f1(ult.esp).replace(',0', '')}` : '—';
  let html = `<h1><svg class="ico" aria-hidden="true"><use href="#i-trend"/></svg> <span class="nome">${esc(a.nome)}</span></h1><div class="mut">${esc(a.equipe)} · atualizado em ${esc(D.gerado_em)}</div>`;
  html += carta(a, ms);
  if (ult) html += `<div class="card"><div class="kpis">
      <div class="kpi"><span>Nota em ${esc(ult.mes)}</span><strong>${f1(ult.pontos)}</strong></div>
      <div class="kpi"><span>Posição</span><strong>${ult.pos}º de ${ult.total}</strong></div>
      <div class="kpi"><span>Média dos meses</span><strong>${f1(media)}</strong></div>
      <div class="kpi"><span>Dias trabalhados</span><strong>${trab}</strong></div></div></div>`;
  if (ms.length) html += `<div class="card"><h2>Nota por mês</h2><div class="grafico"><canvas id="gMes" role="img" aria-label="Nota mensal"></canvas></div></div>
    <div class="card"><h2>Dias trabalhados × esperados</h2><div class="grafico"><canvas id="gDias" role="img" aria-label="Dias trabalhados e esperados por mês"></canvas></div></div>`;
  else html += '<div class="card aviso">Este agente ainda não tem mês registrado.</div>';
  if (sem.length >= 1) html += `<div class="card"><h2>Nota por semana (mês aberto)</h2><div class="grafico"><canvas id="gSem" role="img" aria-label="Nota semanal"></canvas></div>
      <p class="mut">Semana parcial = ainda em andamento; a nota dela pode mudar até sexta.</p></div>`;
  html += linhaTempo(ms, sem);
  if (ult) {
    const li = (arr, cls) => arr.length ? arr.map(x => `<tr><td>${esc(x.c)}</td><td class="n ${cls}">${x.p > 0 ? '+' : ''}${f1(x.p)}</td></tr>`).join('') : '<tr><td class="mut" colspan="2">Nenhum.</td></tr>';
    html += `<div class="card"><h2>O que mais tirou pontos em ${esc(ult.mes)}</h2><table>${li(ult.perdas, 'neg')}</table></div>
      <div class="card"><h2>O que mais deu pontos</h2><table>${li(ult.ganhos, 'pos')}</table></div>`;
  }
  html += `<p class="mut">Só dados públicos do ranking, sem informações de saúde. A conta completa está no Extrato do dashboard e em <a href="transparencia.html">Como o ranking é calculado</a>.</p>`;
  alvo.innerHTML = html;
  const ligar = (id, modo) => { const b = $(id); if (!b) return; b.onclick = () => {
    const msg = $('msgImg'); b.disabled = true; msg.textContent = 'Preparando a imagem…';
    Carta.enviar(a, ms, modo, { ocultarNomes: document.body.classList.contains('modo-apresentacao') })
      .then(t => { msg.textContent = t; }, () => { msg.textContent = 'Não consegui gerar a imagem aqui. Abra a página pelo endereço do site (não pelo arquivo no computador) e tente de novo.'; })
      .then(() => { b.disabled = false; }); }; };
  ligar('bBaixar', 'baixar'); ligar('bZap', 'whatsapp');
  const cor = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';
  if (ms.length && window.Chart) {
    new Chart($('gMes'), { type: 'line', data: { labels: ms.map(m => m.mes.replace('/20', '/')), datasets: [{ label: 'Nota', data: ms.map(m => m.pontos), borderColor: cor('--serie'), backgroundColor: cor('--serie'), tension: .25 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } });
    new Chart($('gDias'), { type: 'bar', data: { labels: ms.map(m => m.mes.replace('/20', '/')), datasets: [
      { label: 'Trabalhados', data: ms.map(m => m.trab), backgroundColor: cor('--serie') }, { label: 'Esperados', data: ms.map(m => m.esp), backgroundColor: cor('--mut') }] },
      options: { responsive: true, maintainAspectRatio: false } });
  }
  if (sem.length && window.Chart) {
    new Chart($('gSem'), { type: 'bar', data: { labels: sem.map(s => `S${s.n}${s.parcial ? ' (parcial)' : ''}`), datasets: [{ label: 'Nota da semana', data: sem.map(s => s.pontos),
      backgroundColor: sem.map(s => s.parcial ? cor('--mut') : cor('--info')) }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } });
  }
}
desenhar();
document.addEventListener('sentinela:tema', () => location.reload());
</script>
</body>
</html>
