<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resposta da contestação — Sentinela</title>
<script src="assets/tema.js"></script>
<link rel="stylesheet" href="assets/fontes.css">
<style>
  :root{--bg:#EEF2F8;--card:#FFFFFF;--tx:#12233B;--mut:#4A5D7C;--bd:#D5DEEA;--pri:#F7B500;--pri-tx:#0A1B33;--warn:#8A6100;--warn-bg:#FFF4D6;--bad:#B3261E;--bad-bg:#FDECEA;--ok:#0B7A44;--ok-bg:#E4F6EC;--info-bg:#E6F1FB;--info:#1565B8;--soft:#F2F6FB;--serie:#0F5FB0;color-scheme:light}
  :root[data-theme="dark"]{--bg:#071426;--card:#0C1F3A;--tx:#E6EDF7;--mut:#9DB2D0;--bd:#1D3C68;--pri:#F7B500;--pri-tx:#0A1B33;--warn:#FFC93D;--warn-bg:#3A2D12;--bad:#FF8478;--bad-bg:#3A1D22;--ok:#5CE59A;--ok-bg:#12301F;--info-bg:#10304F;--info:#6CC4F2;--soft:#102848;--serie:#F7B500;color-scheme:dark}
  header.topo{border-bottom-color:#1D3C68}
  header.topo a{color:#9DD3F5}
  .tema-btn{background:transparent;border:1px solid #2C4F82;color:#DCE7F5;border-radius:6px;padding:6px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap;margin-left:auto}
  .tema-btn + a{margin-left:0}
  .tema-btn:hover{border-color:#F7B500}
  .ico{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico-sol{display:none}:root[data-theme="dark"] .ico-sol{display:inline}:root[data-theme="dark"] .ico-lua{display:none}
  @media (max-width:480px){.tema-btn .tema-txt{display:none}.tema-btn{padding:6px 8px}header.topo{padding-left:10px;padding-right:10px}header.topo .marca{gap:6px}header.topo img{height:22px;padding:2px 4px}header.topo b{font-size:.9rem;letter-spacing:.02em}header.topo a{font-size:.72rem}header.topo b i{display:none}}
  header.topo{background:#050F20;border-bottom:1px solid var(--bd);position:relative;margin:0 0 14px;padding:12px 16px 15px}
  header.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#F7B500 0 120px,#FF5143 120px 168px,#19B8A3 168px 196px,transparent 196px)}
  header.topo .marca{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
  header.topo img{height:34px;background:#fff;padding:3px 8px;border-radius:4px}
  header.topo b{white-space:nowrap;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.2rem;letter-spacing:.04em;color:#fff}
  header.topo b i{font-style:normal;color:#2BA8E8;font-weight:600}
  header.topo a{margin-left:auto;font-size:.85rem;white-space:nowrap}
  @media (max-width:480px){header.topo .marca{gap:8px}header.topo img{height:26px;padding:2px 6px}header.topo b{font-size:1.02rem}header.topo a{font-size:.78rem}}
  h1,h2{font-family:"Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.01em}
  :focus-visible{outline:2px solid #F7B500;outline-offset:2px}
  *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px} .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
  input,button{width:100%;min-height:48px;font-size:1.05rem;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
  button{background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:600;margin-top:10px;cursor:pointer}
  .mut{color:var(--mut)} .erro{color:var(--bad)} a{color:var(--pri)}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol></svg>
<header class="topo"><div class="marca"><img src="assets/logo_ponta_pora.png" alt="Prefeitura Municipal de Ponta Porã"><b>SENTINELA <i>contestação</i></b><button type="button" class="tema-btn" data-tema-btn title="Mudar para o tema escuro"><svg class="ico ico-lua" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ico ico-sol" aria-hidden="true"><use href="#i-sun"/></svg> <span class="tema-txt">Tema escuro</span></button><a href="index.html">← Dashboard</a></div></header>
<main>
  <h1>Resposta do pedido de revisão</h1>
  <div class="card">
    <label for="cod">Digite o código que apareceu quando você enviou o pedido</label>
    <input id="cod" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="Ex.: K7M2QX9P">
    <button id="ver">Ver resposta</button>
  </div>
  <div id="res" class="card" hidden></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function ver() {
  const cod = $('cod').value.trim().toUpperCase(), res = $('res'); res.hidden = false;
  if (!/^[A-Z0-9]{8}$/.test(cod)) { res.innerHTML = '<span class="erro">O código tem 8 letras/números.</span>'; return; }
  res.textContent = 'Consultando…';
  try {
    const cfg = await (await fetch('data/config_worker.json?' + Date.now())).json();
    const url = (cfg.url || '').replace(/\/$/, '');
    if (!url) throw new Error('Serviço ainda não configurado.');
    const r = await fetch(`${url}/contestacao?codigo=${encodeURIComponent(cod)}`); const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || 'Não consegui consultar agora.');
    const sit = j.status === 'aberta' ? '⏳ Ainda em análise.' : j.status === 'aceita' ? '✅ Pedido aceito.' : '⛔ Pedido não aceito.';
    res.innerHTML = `<p><b>${sit}</b></p><p class="mut">Critério: ${esc(j.criterio)} · ${esc(j.mes)}</p>${j.resposta ? `<p>${esc(j.resposta)}</p>` : ''}${j.respondida_em ? `<p class="mut">Respondido em ${esc(j.respondida_em)}.</p>` : ''}`;
  } catch (e) { res.innerHTML = `<span class="erro">${esc(e.message)}</span>`; }
}
$('ver').onclick = ver; $('cod').addEventListener('keydown', e => { if (e.key === 'Enter') ver(); });
const c = new URLSearchParams(location.search).get('codigo'); if (c) { $('cod').value = c; ver(); }
</script>
</body>
</html>
