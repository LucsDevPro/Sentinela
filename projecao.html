<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinela — Tela de reunião</title>
<script src="assets/tema.js"></script>
<link rel="stylesheet" href="assets/fontes.css">
<script src="assets/chart.umd.js"></script>
<link rel="stylesheet" href="assets/projecao.css"></head>
<body><svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol></svg>
<header>
  <img src="assets/logo_ponta_pora.png" alt="Prefeitura Municipal de Ponta Porã"><b>SENTINELA <i>tela de reunião</i></b><span class="esp"></span>
  <button class="bt" id="bPausa" type="button" title="Pausar ou continuar (barra de espaço)"><svg class="ico"><use href="#i-pause"/></svg><span>Pausar</span></button>
  <select class="bt" id="vel" aria-label="Tempo de cada tela"><option value="10">10 s por tela</option><option value="15" selected>15 s por tela</option><option value="25">25 s por tela</option></select>
  <button class="bt" id="bNomes" type="button" title="Mostrar ou ocultar nomes (tecla N)"><svg class="ico"><use href="#i-eye"/></svg><span>Nomes: ocultos</span></button>
  <button class="bt" data-tema-btn type="button"><svg class="ico ico-lua"><use href="#i-moon"/></svg><svg class="ico ico-sol"><use href="#i-sun"/></svg><span class="tema-txt">Tema escuro</span></button>
  <button class="bt" id="bTela" type="button" title="Tela cheia (tecla F)"><svg class="ico"><use href="#i-expand"/></svg><span>Tela cheia</span></button>
  <a class="bt" href="index.html">Voltar</a>
</header>
<div class="prog"><i id="barra"></i></div>
<main id="palco"></main>
<div class="dots" id="dots"></div>
<script src="assets/agentes_dados.js"></script>
<script src="assets/projecao.js"></script>
</body></html>
